<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="720" viewBox="0 0 1440 720" role="img" aria-labelledby="title desc">
  <title id="title">0から100までの人間とAIの担当範囲</title>
  <desc id="desc">0から10は人間が設計し、10から90はAIが実装し、90から100は人間がレビューと手直しをする</desc>
  <defs>
    <style>
      .base { font-family: "Hiragino Sans", "Yu Gothic", sans-serif; fill: #24272b; }
      .title { font-size: 44px; font-weight: 700; }
      .sub { font-size: 22px; fill: #687078; }
      .number { font-size: 28px; font-weight: 700; }
      .owner { font-size: 25px; font-weight: 700; }
      .card-head { font-size: 27px; font-weight: 700; }
      .card-body { font-size: 21px; fill: #525a62; }
      .conclusion { font-size: 27px; font-weight: 700; }
    </style>
  </defs>

  <rect width="1440" height="720" rx="28" fill="#fbfbf8"/>
  <text class="base title" x="72" y="78">最初と最後は人間、真ん中の実装はAI</text>
  <text class="base sub" x="72" y="118">完成までを0→100で見たときの、自分の進め方</text>

  <g transform="translate(120 180)">
    <text class="base number" x="0" y="-24" text-anchor="middle">0</text>
    <text class="base number" x="120" y="-24" text-anchor="middle">10</text>
    <text class="base number" x="1080" y="-24" text-anchor="middle">90</text>
    <text class="base number" x="1200" y="-24" text-anchor="middle">100</text>

    <rect width="120" height="86" rx="18" fill="#63b451"/>
    <rect x="120" width="960" height="86" fill="#34383e"/>
    <rect x="1080" width="120" height="86" rx="18" fill="#63b451"/>
    <path d="M120 0v86M1080 0v86" stroke="#fbfbf8" stroke-width="5"/>
    <text class="owner" x="60" y="54" text-anchor="middle" fill="#fff">人間</text>
    <text class="owner" x="600" y="54" text-anchor="middle" fill="#fff">AI</text>
    <text class="owner" x="1140" y="54" text-anchor="middle" fill="#fff">人間</text>
  </g>

  <line x1="180" y1="280" x2="290" y2="348" stroke="#9aa1a7" stroke-width="3" stroke-dasharray="7 8"/>
  <line x1="720" y1="280" x2="720" y2="348" stroke="#9aa1a7" stroke-width="3" stroke-dasharray="7 8"/>
  <line x1="1260" y1="280" x2="1150" y2="348" stroke="#9aa1a7" stroke-width="3" stroke-dasharray="7 8"/>

  <g>
    <rect x="72" y="348" width="430" height="190" rx="22" fill="#eef7ea" stroke="#b9daaf" stroke-width="2"/>
    <circle cx="116" cy="394" r="20" fill="#63b451"/>
    <text class="base owner" x="116" y="403" text-anchor="middle" fill="#fff">1</text>
    <text class="base card-head" x="151" y="404">箱を作る</text>
    <text class="base card-body" x="112" y="452">interface / class</text>
    <text class="base card-body" x="112" y="487">責務・境界・入出力を決める</text>
  </g>

  <g>
    <rect x="505" y="348" width="430" height="190" rx="22" fill="#f0f1f2" stroke="#c9cdd0" stroke-width="2"/>
    <circle cx="549" cy="394" r="20" fill="#34383e"/>
    <text class="owner" x="549" y="403" text-anchor="middle" fill="#fff">2</text>
    <text class="base card-head" x="584" y="404">実装する</text>
    <text class="base card-body" x="545" y="452">メソッドの中身をAIへ任せる</text>
    <text class="base card-body" x="545" y="487">別案や知らない方法も拾う</text>
  </g>

  <g>
    <rect x="938" y="348" width="430" height="190" rx="22" fill="#eef7ea" stroke="#b9daaf" stroke-width="2"/>
    <circle cx="982" cy="394" r="20" fill="#63b451"/>
    <text class="owner" x="982" y="403" text-anchor="middle" fill="#fff">3</text>
    <text class="base card-head" x="1017" y="404">レビュー・手直し</text>
    <text class="base card-body" x="978" y="452">テスト / 依存 / セキュリティ</text>
    <text class="base card-body" x="978" y="487">意図と合うかを自分で確認</text>
  </g>

  <rect x="185" y="582" width="1070" height="76" rx="20" fill="#fff0d5" stroke="#efc36f" stroke-width="2"/>
  <text class="base conclusion" x="720" y="630" text-anchor="middle">大枠を先に決めておくと、最後の確認が軽くなる</text>
</svg>
